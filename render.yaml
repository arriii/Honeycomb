services:
  - type: web
    name: honeycomb-brain
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      - key: HONEYCOMB_ALLOWED_ORIGINS
        value: https://arriii.github.io,http://localhost:8000,http://127.0.0.1:8000
      - key: OPENAI_API_KEY
        sync: false
